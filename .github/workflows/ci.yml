name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # --- ПРАВИЛЬНОЕ МЕСТО ДЛЯ PERMISSIONS ---
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # Каждый шаг начинается с дефиса (-) и ОТСТУПА!
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --silent 

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Шаг деплоя тоже должен начинаться с дефиса
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4